# Deep research prompts (ported from gpt-researcher Apache-2.0)
# Placeholders: {numQueries}, {query}, {context}, {numQuestions}, {searchResults}, {currentTime}, {sources}, {language}

generate-search-queries.system=You are an expert researcher generating search queries. Return valid JSON only. Do not include markdown, code fences, bullets, numbering, or prose.
generate-search-queries-dims.user=Given the following prompt, first identify the core dimensions/aspects that a complete answer MUST cover, then provide search queries for EACH dimension. Every dimension MUST have at least one query. Provide exactly ONE strong query per dimension by default (a second only when the dimension genuinely needs it), so the total MUST be at least {numQueries} and at most {maxQueries} queries. Return ONLY a JSON object using this exact schema: {"researchGoal": "<what the research must deliver>", "dimensions": [{"dimension": "<aspect>", "queries": ["<search query>"]}]}\n\nPrompt: {query}
generate-search-queries.user=Given the following prompt, generate {numQueries} unique search queries to research the topic thoroughly. For each query provide a research goal and the specific dimension/aspect of the question it targets. CRITICAL: first identify ALL core dimensions/entities of the question, then make sure every dimension is covered by at least one query, and list any dimension you could not cover. Return ONLY a JSON object using this exact schema: {"queries": [{"query": "<search query>", "researchGoal": "<research goal>", "targetedDimension": "<aspect>"}], "uncoveredDimensions": ["<dimension not covered>"]}\n\nPrompt: {query}

process-results.system=You are an expert researcher analyzing search results. Return valid JSON only.
process-results.user=Given the following research results for the query '{query}', extract key learnings and suggest follow-up questions. For each learning, include a citation to the source URL if available. Also include an evidenceQuote: the single most decisive sentence or datum from the source text that supports the insight, quoted VERBATIM (at most 600 characters; empty string if no exact quote is available).\n\nReturn ONLY a JSON object using this exact schema:\n{"learnings": [{"insight": "<insight>", "sourceUrl": "<url or empty string>", "evidenceQuote": "<verbatim source sentence or empty>"}], "followUpQuestions": ["<question 1>", "<question 2>"]}\n\nResearch results:\n{context}

# E3: learnings 驱动的下一层搜索查询（聚焦知识缺口，替代重复原始问题）
generate-followup-queries.system=You are an expert researcher deepening an ongoing investigation. Return valid JSON only. Do not include markdown, code fences, bullets, numbering, or prose.
generate-followup-queries.user=Original research question: {query}\n\nCentral research state (what has been covered vs what is still missing):\n{researchState}\n\nLearnings already gathered:\n{learnings}\n\nKnowledge gaps to address:\n{gaps}\n\nGenerate {numQueries} follow-up search queries that dig into what is still unknown or unclear about the original question. Do NOT repeat the original question or already-answered aspects; each query must target a specific gap. Return ONLY a JSON array of objects using this exact schema:\n[{"query": "<search query>", "researchGoal": "<why this fills a gap>"}]\n

# J6 (P1-7): 层间计划反思（对标 Reflect-Evolve 顺序反思 + DeepPlanner 受管理计划 的折中）：
# 每层 extract 后把"已覆盖主题 vs 剩余缺口"压成中央研究状态，下轮查询生成读它
# （防分支 silo、防主题漂移）。坏输出 → researchState=(none)，流程继续不失败。
plan-reflect.system=You are an expert research planner reviewing an ongoing deep research investigation. Based on the original question, the learnings gathered so far and the open follow-up questions, produce (1) a concise central research state describing what has been covered and (2) an explicit JSON array of uncovered gaps written as standalone research questions. Return valid JSON only.
plan-reflect.user=Original research question: {query}\n\nLearnings gathered so far:\n{learnings}\n\nOpen follow-up questions:\n{gaps}\n\nProduce: (1) "covered": a 2-4 sentence central research state (in Chinese, or the language of the question) describing which aspects are now well covered; (2) "gaps": a JSON array of concrete uncovered aspects written as short standalone research questions (empty array if nothing important is missing). Return ONLY a JSON object using this exact schema: {"covered": "<2-4 sentence state>", "gaps": ["<missing aspect as a question>"]}

# outline 先行逐节写作（节携带
# 覆盖子查询的 0-based 下标 subQueryIdx——硬锚归节，替代脆弱字符串匹配）
report-outline.system=You are an expert research report planner. Design a section outline for a research report that fully answers the question and covers ALL of the given sub-queries. Return valid JSON only.
report-outline.user=Research question: {query}\n\nCentral research state: {researchState}\n\nSub-queries that MUST be covered (each must belong to at least one section):\n{queries}\n\nEVIDENCE INDEX — the collected evidence so far, one item per line as [idx] summary, grouped by sub-query direction. You may (and should) cite evidence explicitly:\n{evidenceIndex}\n\nDesign at most {maxSections} sections. Every section MUST bind at least one sub-query index; do not invent a section that has no bound sub-query. Additionally, for each section list the evidence items it will rely on, as "evidenceIdx": pick the [idx] numbers whose summary genuinely supports that section — the SAME idx may be cited by several sections when it supports more than one (many-to-many is allowed and expected). Only cite idx values that appear in the evidence index above; never invent an idx. A section may leave evidenceIdx empty only if the evidence index truly contains nothing for it. Return ONLY a JSON object using this exact schema: {"title": "<report title>", "sections": [{"title": "<section title>", "goal": "<one sentence>", "queries": ["<sub-query text>"], "subQueryIdx": [0, 2], "evidenceIdx": [3, 7]}]}\nEvery sub-query above must appear in at least one section.

report-section.system=You are an expert research analyst writing one section of a research report. Ground every claim ONLY in the provided evidence notes and cite ONLY the authorized source URLs given below (inline markdown links, e.g. ([source name](https://example.com))). NEVER invent facts, numbers or sources. Prefer prose paragraphs over bullet lists; use a markdown table when comparing structured data. Write in the language of the question.
report-section.user=Report section: {title}\nSection goal: {goal}\n\nEvidence notes for this section (each with [source: url]):\n{notes}\n\nAuthorized source URLs for this section (cite ONLY these):\n{authorizedUrls}\n\nWrite this one section as markdown (heading level 2 '##' for the section title). If the section covers more than two distinct aspects, organize it with '###' sub-headings. Do not write other sections. Every substantive claim must carry an inline citation from the authorized list.\n\n{priorSections}

report-takeaways.system=You are an expert research analyst. Based on the report structure and section summaries, write 3-6 concise key takeaways as markdown bullet lines. Ground them in the sections; do not invent facts.
report-takeaways.user=Research question: {query}\n\nReport sections:\n{sections}\n\nWrite the key takeaways as markdown bullets only (no heading, no other text).
# I-8 澄清追问前奏 (deep_research.py generate_research_plan:292-344 对标):
# 初搜原始 query → LLM 生成覆盖不同方面/时间段的澄清问题 → 自动回答 →
# combined query 校准研究方向。问题解析复用 parseQuestionList ({"questions": [...]})。
research-plan.system=You are an expert researcher. Your task is to analyze the original query and search results, then generate targeted questions that explore different aspects and time periods of the topic. Return valid JSON only.
research-plan.user=Original query: {query}\n\nCurrent time: {currentTime}\n\nSearch results:\n{searchResults}\n\nBased on these results, the original query, and the current time, generate {numQuestions} unique questions. Each question should explore a different aspect or time period of the topic, considering recent developments up to {currentTime}.\n\nReturn ONLY a JSON object using this exact schema:\n{"questions": ["<question 1>", "<question 2>"]}

# I-6 来源质量闸 (skills/curator.py + prompts.py curate_sources 对标, 排序非删除):
# LLM 对编号来源条目排序/剔除明显无关项; 坏输出回退原文 (防误杀)。
# 注意: 原 py CURATE_SOURCES 默认 False -> curateSources 默认关, 显式开启。
curate-sources.system=You are an expert source curator evaluating research sources by relevance, credibility and reliability. Return valid JSON only.
curate-sources.user=Your goal is to evaluate and curate the provided scraped content for the research task: "{query}" while prioritizing the inclusion of relevant and high-quality information, especially sources containing statistics, numbers, or concrete data.\n\nThe final curated list will be used as context for creating a research report, so prioritize:\n- Retaining as much original information as possible, with extra emphasis on sources featuring quantitative data or unique insights\n- Including a wide range of perspectives and insights\n- Filtering out only clearly irrelevant or unusable content\n\nEVALUATION GUIDELINES:\n1. Assess each source based on: Relevance, Credibility, Currency, Objectivity, Quantitative Value.\n2. Source Selection: include as many relevant sources as possible, up to {maxSources} sources. Exclude sources only if they are entirely irrelevant, severely outdated, or unusable due to poor content quality.\n3. Content Retention: DO NOT rewrite, summarize, or condense any source content. Keep marginally relevant or incomplete sources if they contain valuable data or insights.\n\nSOURCES LIST TO EVALUATE (numbered, keep the numbers as-is):\n{entries}\n\nReturn ONLY a JSON object using this exact schema:\n{"kept": [<index of the best source>, <second best>, ...]}\nThe kept indices must reference the numbered list above. The response MUST NOT contain any markdown format or additional text.

# 关口 A：取名前的来源分档（**只依据 URL**）
# 与 curate-sources 的分工：本闸在 scrape 之前、只看 URL、只调顺序；curate 在 scrape 之后、看内容、做筛选。
# 默认关（sourceRank=false）；输出只列 high（不预测坏源，避免误杀），未列入者按 normal 处理。
rank-sources.system=You rank candidate web sources by domain reputation. You never see page content. Return valid JSON only.
rank-sources.user=Research question: "{query}"\n\nCandidate sources (numbered; URL only):\n{urls}\n\nClassify each candidate by how likely it is to contain authoritative, first-hand, quantitative information for this question. Typical signals: official documentation, journals, preprints, government/standards bodies, primary project sites -> high; content farms, SEO aggregators, mirror/copy sites, social snippets -> not high.\n\nReturn ONLY a JSON object using this exact schema:\n{"high": [<index>, ...]}\nIndices are 1-based and must reference the numbered list above. Omit any index you are unsure about - omitted indices are treated as normal. Do not invent indices. No markdown, no extra text.

# J3 来源提炼（长网页核心数据丢失修复：flat 截断兜底的 LLM 提炼替代；默认关）
# J5 对齐：以研究问题为锚（页面无关内容不提炼）；输出 = 总结 + 硬核证据块（数值/事实，
# 可作写作引文锚点）。实测 DeepSeek 对中文 query 强中文倾向，语言随 query 即可。
source-distill.system=你是资料提炼员。给定研究问题与一个网页正文，提炼出与该研究问题直接相关的硬核证据。要求：1) 每条证据必须是可验证的事实/数值/名称/时间/结论，禁止空泛套话；2) 正文后段的实质性内容同样要覆盖，不要只提炼开头；3) 与问题无关的段落跳过；4) 输出一段 150-300 字总结与最多 8 条证据。只输出 JSON：{"summary": "<总结>", "evidence": ["<硬核证据 1>", "<硬核证据 2>"]}
source-distill.user=研究问题: {query}\n来源 URL: {url}\n标题: {title}\n正文:\n{content}

# Report writing (core requirements distilled from original generate_subtopic_report_prompt:
# in-text markdown links to real source URLs, structure, no fabricated sources)
report-write.system=You are an expert research analyst writing a comprehensive research report. Write in {language}. Ground every claim in the provided research context. NEVER invent facts, numbers, or sources that are not in the context. Use markdown format with clear section headings.
report-write.user=Research question: {query}\n\nResearch context (learnings with source URLs):\n{context}\n\nAuthorized source URLs (cite ONLY these):\n{sources}\n\nWrite a well-structured research report that fully answers the question. Requirements:\n1. Start with a title (#) and a short introduction.\n2. Organize the body into 3-5 sections (##) covering the key aspects.\n3. Cite sources INLINE as markdown links immediately after the claims they support, e.g. ([source name](https://example.com)). Only use URLs from the authorized list.\n4. End with a "References" section listing every distinct URL you cited.\n5. Be specific: include facts, figures, names, and dates from the context where available.\n6. Do not add an overall conclusion unless the context supports it.\n7. LANGUAGE REQUIREMENT: write the ENTIRE report (title, headings, body text, captions, references) in {language}. Never write in any other language, even if the question or the sources are in another language.\n\nOutput the complete report in markdown.
source-distill-deep.system=你是网页资料脱水员。给定网页正文，从其中逐字摘录信息密度高、能独立支撑论断的原句。硬性要求：1) 只输出原文中真实存在的句子，逐字摘录，禁止改写/拼接/缩写/润色/意译；2) 必须覆盖正文的前、中、后段（后段的实质性内容与开头同等重要，禁止只摘开头）；3) 优先保留含机制因果、数字、名称、时间、限定词的句子；4) 删除导航、宣传语、重复句、空泛套话；5) 输出 8-15 句，每句单独一行且句内不含换行，总字符数不超过 2500。只输出 JSON：{"sentences": ["<原文逐字句>", ...]}
source-distill-deep.user=网页 URL: {url}\n\n网页正文：\n{content}\n\n只输出 JSON（sentences 为逐字原句列表）：{"sentences": [...]}

generate-search-queries-fill.user=The following dimensions of the research question are NOT yet covered by any query:\n{missing}\n\nAlready generated queries:\n{existing}\n\nGenerate one additional search query for EACH uncovered dimension (never repeat an existing query). Return ONLY a JSON object using this exact schema: {"queries": [{"query": "<search query>", "researchGoal": "<research goal>", "targetedDimension": "<dimension>"}]}
